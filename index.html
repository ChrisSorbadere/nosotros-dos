<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosotros Dos</title>
<meta name="description" content="Blanca y Chris — Preguntas, retos, salidas y rituales para dos">
<meta name="theme-color" content="#c4714a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nosotros Dos">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --warm: #f5ede0;
    --terracotta: #c4714a;
    --terra-light: #e8a07a;
    --terra-dark: #9a4f2e;
    --ink: #2a1f1a;
    --ink-soft: #5a4a40;
    --gold: #c9a84c;
    --gold-light: #e8d49a;
    --sage: #7a9e7e;
    --blush: #d4908a;
    --indigo: #5c6b8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(196,113,74,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating hearts */
  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .heart-float {
    position: absolute;
    font-size: 1rem;
    opacity: 0;
    animation: floatHeart linear infinite;
    user-select: none;
  }

  @keyframes floatHeart {
    0%   { transform: translateY(110vh) scale(0.6) rotate(-15deg); opacity: 0; }
    10%  { opacity: 0.18; }
    90%  { opacity: 0.12; }
    100% { transform: translateY(-10vh) scale(1.1) rotate(15deg); opacity: 0; }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 50px 0 36px;
    position: relative;
  }

  .header-hearts {
    font-size: 1.4rem;
    letter-spacing: 10px;
    color: var(--terracotta);
    opacity: 0.55;
    margin-bottom: 10px;
    display: block;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    font-weight: 400;
    color: var(--ink);
    line-height: 1.1;
  }

  h1 em {
    font-style: italic;
    color: var(--terracotta);
  }

  .header-sub {
    font-size: 0.87rem;
    color: var(--ink-soft);
    margin-top: 10px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .header-names {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--terracotta);
    margin-top: 8px;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  .header-deco {
    margin-top: 18px;
    font-size: 0.95rem;
    color: var(--terracotta);
    opacity: 0.35;
    letter-spacing: 6px;
  }

  /* Categories */
  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 32px 0 24px;
  }

  .cat-btn {
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 100px;
    transition: all 0.22s ease;
    letter-spacing: 0.3px;
    position: relative;
  }

  .cat-btn.active {
    transform: scale(1.06);
    box-shadow: 0 4px 18px rgba(0,0,0,0.14);
  }

  .cat-btn:hover:not(.active) { transform: scale(1.03); }

  .cat-0 { background: #fde8dc; color: #8a3a20; }
  .cat-0.active { background: var(--terracotta); color: white; }
  .cat-1 { background: #e8f0e0; color: #3a5e30; }
  .cat-1.active { background: var(--sage); color: white; }
  .cat-2 { background: #e0e6f0; color: #2a3d5e; }
  .cat-2.active { background: var(--indigo); color: white; }
  .cat-3 { background: #f5e8d8; color: #7a4820; }
  .cat-3.active { background: var(--gold); color: white; }
  .cat-4 { background: #f0e0e0; color: #7a2e2e; }
  .cat-4.active { background: var(--blush); color: white; }
  .cat-5 { background: #e8e0f0; color: #3a2a6a; }
  .cat-5.active { background: #7a6aaa; color: white; }
  .cat-6 { background: #e0f0ec; color: #1a5a48; }
  .cat-6.active { background: #3a8a72; color: white; }
  .cat-7 { background: #f0e8d8; color: #5a3e1a; }
  .cat-7.active { background: #a07840; color: white; }

  /* Progress dots */
  .progress-bar {
    margin: 0 0 20px;
    text-align: center;
    min-height: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .progress-label {
    font-size: 0.75rem;
    color: var(--ink-soft);
    opacity: 0.55;
    letter-spacing: 0.3px;
  }

  .progress-dots {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    max-width: 500px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(90,74,64,0.15);
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  .dot.seen {
    background: var(--terracotta);
    transform: scale(1.1);
  }

  .dot.heart {
    background: none;
    font-size: 8px;
    width: 10px;
    height: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Card area */
  .card-area {
    position: relative;
    min-height: 290px;
    margin: 0 0 22px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 38px 44px;
    box-shadow: 0 8px 40px rgba(42,31,26,0.08), 0 2px 8px rgba(42,31,26,0.04);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }

  /* Decorative heart inside card */
  .card::after {
    content: '♥';
    position: absolute;
    bottom: 16px;
    left: 22px;
    font-size: 0.8rem;
    color: var(--terracotta);
    opacity: 0.15;
  }

  .card.color-0::before { background: linear-gradient(90deg, var(--terracotta), var(--terra-light)); }
  .card.color-1::before { background: linear-gradient(90deg, var(--sage), #a8d4ac); }
  .card.color-2::before { background: linear-gradient(90deg, var(--indigo), #8a9eba); }
  .card.color-3::before { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .card.color-4::before { background: linear-gradient(90deg, var(--blush), #e8b0aa); }
  .card.color-5::before { background: linear-gradient(90deg, #7a6aaa, #aaa0cc); }
  .card.color-6::before { background: linear-gradient(90deg, #3a8a72, #6abaa4); }
  .card.color-7::before { background: linear-gradient(90deg, #a07840, #d4b07a); }

  .card-tag {
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 18px;
    opacity: 0.55;
  }

  .card-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.15rem, 2.8vw, 1.5rem);
    line-height: 1.58;
    color: var(--ink);
  }

  .card-sub {
    margin-top: 16px;
    font-size: 0.87rem;
    color: var(--ink-soft);
    line-height: 1.62;
    font-weight: 300;
  }

  .card-counter {
    position: absolute;
    bottom: 18px;
    right: 22px;
    font-size: 0.73rem;
    color: var(--ink-soft);
    opacity: 0.35;
  }

  /* Empty state */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 270px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty-icon { font-size: 2.8rem; margin-bottom: 14px; }
  .empty-text { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-style: italic; }
  .empty-sub { font-size: 0.84rem; margin-top: 8px; opacity: 0.65; }

  /* Buttons */
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-main {
    background: var(--terracotta);
    color: white;
    border: none;
    padding: 15px 34px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.93rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
    box-shadow: 0 4px 20px rgba(196,113,74,0.32);
  }

  .btn-main:hover {
    background: var(--terra-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(196,113,74,0.4);
  }

  .btn-main:active { transform: translateY(0); }

  .btn-sec {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid rgba(90,74,64,0.24);
    padding: 14px 22px;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.87rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-sec:hover {
    border-color: var(--terracotta);
    color: var(--terracotta);
    background: rgba(196,113,74,0.05);
  }

  .stats {
    text-align: center;
    margin-top: 18px;
    font-size: 0.77rem;
    color: var(--ink-soft);
    opacity: 0.45;
  }

  /* Favorites */
  .favs-section {
    margin-top: 46px;
    border-top: 1px solid rgba(90,74,64,0.11);
    padding-top: 32px;
  }

  .favs-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fav-item {
    background: var(--warm);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 8px;
    font-size: 0.87rem;
    color: var(--ink);
    line-height: 1.5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    animation: cardIn 0.3s ease;
  }

  .fav-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    opacity: 0.38;
    font-size: 0.95rem;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .fav-remove:hover { opacity: 0.75; }

  .fav-cat {
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.48;
    margin-bottom: 3px;
  }

  /* Footer hearts */
  .footer-hearts {
    text-align: center;
    margin-top: 48px;
    font-size: 1rem;
    color: var(--terracotta);
    opacity: 0.25;
    letter-spacing: 8px;
  }

  @media (max-width: 480px) {
    .card { padding: 26px 22px; }
    .btn-main { padding: 13px 26px; }
  }
</style>
</head>
<body>

<!-- Floating hearts background -->
<div class="hearts-bg" id="heartsbg"></div>

<div class="app">
  <header>
    <span class="header-hearts">♥ ♡ ♥</span>
    <h1>Nosotros <em>Dos</em></h1>
    <p class="header-names">Blanca &amp; Chris</p>
    <p class="header-sub">Preguntas · Retos · Salidas · Juegos · Rituales</p>
    <div class="header-deco">❧ ❧ ❧</div>
  </header>

  <div class="categories" id="categories"></div>

  <div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-label" id="progressLabel"></div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <div class="card-area" id="cardArea">
    <div class="empty">
      <span class="empty-icon">♡</span>
      <p class="empty-text">Elige una categoría</p>
      <p class="empty-sub">y saca una carta</p>
    </div>
  </div>

  <div class="actions">
    <button class="btn-main" onclick="draw()">Sacar una carta</button>
    <button class="btn-sec" id="btnFav" onclick="saveFav()" style="display:none">♡ Guardar</button>
    <button class="btn-sec" onclick="randomCategory()">Al azar</button>
    <button class="btn-sec" id="btnReset" onclick="resetCurrent()">↺ Reiniciar</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="favs-section" id="favsSection" style="display:none">
    <p class="favs-title">♥ Mis favoritas</p>
    <div id="favsList"></div>
  </div>

  <div class="footer-hearts">♥ ♡ ♥ ♡ ♥</div>
</div>

<script>
const CATEGORIES = [
  {
    id: 0, label: "💬 Preguntas profundas", short: "Pregunta",
    items: [
      { text: "¿Cuál es el recuerdo que más atesorarías de nosotros dos?", sub: "Tómate tu tiempo para responder de verdad." },
      { text: "¿Qué hago yo que todavía te hace sonreír sin razón?", sub: null },
      { text: "¿Hay algo que nunca me hayas dicho y que te hubiera gustado decirme?", sub: "No es una obligación — solo una invitación." },
      { text: "Si pudiéramos empezar de cero hoy, ¿dónde viviríamos y por qué?", sub: null },
      { text: "¿Cuál es el sueño que tienes y que quisieras que viviéramos juntos antes de los 65?", sub: null },
      { text: "¿Cuál es tu recuerdo favorito de este último año?", sub: null },
      { text: "¿Qué harías diferente si pudieras volver a 2015?", sub: "El año en que todo empezó." },
      { text: "¿Qué te he aportado que no esperabas?", sub: null },
      { text: "¿De qué cosa tuya te sientes más orgulloso/a en este momento?", sub: null },
      { text: "Si tuvieras que describir nuestra relación con una película, ¿cuál sería?", sub: null },
      { text: "¿Qué te ha sorprendido más de mí desde que nos conocemos?", sub: null },
      { text: "¿Cuál es tu lugar favorito en el mundo cuando estamos juntos?", sub: null },
      { text: "Si pudieras cambiar una sola cosa de nuestro día a día, ¿cuál sería?", sub: "Para recibir sin ponerse a la defensiva." },
      { text: "¿Hay algo que quisieras aprender o vivir y que nunca te hayas atrevido a decir?", sub: null },
      { text: "¿Cuál es el gesto que he tenido contigo y que nunca olvidarás?", sub: null },
      { text: "Si me escribieras una carta para leer dentro de 10 años, ¿qué dirías?", sub: "Quizás incluso escribirla de verdad." },
      { text: "¿Qué nos hace realmente diferentes a otras parejas?", sub: null },
      { text: "¿Hay algo que te guste de cómo nos peleamos?", sub: "Sí, incluso eso puede tener su valor." },
      { text: "Si pudieras pasar un día entero haciendo lo que quisieras, sin mí — ¿qué harías?", sub: null },
      { text: "¿Qué haces por mí que crees que no noto?", sub: null },
      { text: "¿Qué es lo que todavía te atrae de mí después de todos estos años?", sub: null },
      { text: "¿Cuál es tu sueño secreto que no le has contado a nadie más?", sub: null },
      { text: "Si nuestra pareja fuera un paisaje, ¿cuál sería?", sub: "Montaña, mar, bosque, desierto, campo..." },
      { text: "¿Qué harías si supieras que no puedes fracasar?", sub: null },
      { text: "¿Cuál fue el momento en que pensaste 'es él / es ella'?", sub: "Quizás la primera vez, quizás la centésima." },
      { text: "¿Qué canción te recuerda a mí automáticamente?", sub: null },
      { text: "Si pudieras describir nuestra relación con un solo color, ¿cuál sería y por qué?", sub: null },
      { text: "¿Cuál es la cosa más pequeña que hago y que te hace sentir querido/a?", sub: null },
      { text: "¿Qué es lo que más te cuesta pedirme?", sub: "Sin juicio. Solo curiosidad." },
      { text: "Si tuviéramos que mudarnos mañana a otro país, ¿adónde irías sin dudar?", sub: null },
      { text: "¿Qué versión de mí es tu favorita? ¿El Chris del fin de semana, del trabajo, de viaje...?", sub: null },
      { text: "¿Hay algo que hayas aprendido de mí que apliques en tu vida sin que yo lo sepa?", sub: null },
      { text: "¿Cuál es el momento del día en que más me echas de menos cuando no estoy?", sub: null },
      { text: "¿Qué es lo que más te gusta de cómo hemos construido nuestra vida juntos?", sub: null },
      { text: "Si solo pudieras quedarte con tres recuerdos nuestros para siempre, ¿cuáles serían?", sub: null },
      { text: "¿Qué es lo que más te asusta del futuro — y lo que más te ilusiona?", sub: "Responderos el uno al otro." },
      { text: "¿Hay algo que yo haga y que secretamente te encante aunque no me lo hayas dicho?", sub: null },
      { text: "¿Cuándo fue la última vez que te sentiste realmente orgulloso/a de nosotros como pareja?", sub: null },
      { text: "Si pudieras preguntarme algo y tuvieras la garantía de una respuesta honesta, ¿qué sería?", sub: null },
      { text: "¿Qué es lo que más has cambiado desde que estamos juntos?", sub: null },
      { text: "¿Hay algún sueño que hayas abandonado y que te gustaría retomar?", sub: null },
      { text: "¿Qué es lo que más valoras de nuestra manera de resolver los conflictos?", sub: null },

      { text: "¿Qué es lo que más te cuesta perdonarme — y lo que más te resulta fácil?", sub: "Para responder con honestidad y ternura." },
      { text: "¿Hay algún lugar del mundo donde sientas que pertenecemos juntos?", sub: null },

      { text: "Si pudieras cambiar algo de ti mismo/a para ser mejor pareja, ¿qué sería?", sub: null },

  },
  {
    id: 1, label: "🎲 Juegos y Retos", short: "Reto",
    items: [
      { text: "Quiz: 5 preguntas sobre el otro", sub: "Su canción favorita ahora · Su plato reconfortante · Lo que más le molesta en el trabajo · Su actor/actriz favorito · Su miedo secreto. ¡Contad los puntos!" },
      { text: "Blind test casero", sub: "Cada uno prepara 10 canciones que el otro debe identificar. Con una copa, aún mejor." },

      { text: "¿Quién lo dijo?", sub: "Releed mensajes o correos antiguos juntos e intentad adivinar quién los escribió. Acabaréis riendo." },

      { text: "Noche 'revivimos la peli'", sub: "Volved a ver una película que visteis juntos al principio de vuestra relación. La conversación está garantizada." },

      { text: "La palabra prohibida", sub: "Elegid una palabra cotidiana (ej: 'bien', 'sí', 'vale'). Durante toda la noche, el que la diga pierde un punto." },
      { text: "Trivia geográfica", sub: "Por turnos, nombrad una ciudad de un país elegido. El primero que no sabe pierde. Se permite el mapa." },
      { text: "Charadas en pareja", sub: "Cada uno prepara 5 charadas. Se juega por turnos. Nivel: se recomienda el absurdo." },
      { text: "El reto del 'cumplido inesperado'", sub: "Cada uno debe hacer 3 cumplidos al otro sobre cosas poco habituales — nada de los clásicos. Sed creativos." },
      { text: "Noche 'lo mejor de nosotros'", sub: "Buscad fotos antiguas juntos. Cada uno elige su foto favorita del otro y explica por qué." },
      { text: "¿Quién soy?", sub: "Pegad un post-it con un nombre famoso en la frente del otro. Preguntas de sí/no para adivinar." },
      { text: "Concurso de ligoteo", sub: "Sois dos desconocidos en un café. Cada uno intenta 'seducir' al otro con su mejor frase. Responded como si no os conocierais." },
      { text: "El minuto de silencio al revés", sub: "60 segundos en los que hay que hablar sin parar al otro, sin pausas. Sobre cualquier tema. El primero que se calla pierde." },
      { text: "Dibujo colaborativo", sub: "En la misma hoja: cada uno dibuja por turnos, 30 segundos. No se sabe adónde va. Se para después de 10 turnos." },
      { text: "El 'Y si...' encadenado", sub: "Una frase empieza por '¿Y si...?' y el otro continúa la historia. Se encadenan durante al menos 5 minutos." },
      { text: "El juego de las mentiras", sub: "Cada uno dice 3 afirmaciones sobre sí mismo: 2 verdades, 1 mentira. El otro adivina cuál es la mentira." },
      { text: "Reto: cocinar con los ojos vendados", sub: "Uno da instrucciones, el otro cocina con los ojos tapados. Solo platos simples. Supervisión de seguridad obligatoria." },
      { text: "El diccionario inventado", sub: "Por turnos, inventad una palabra y su definición. El otro decide si la añadiría al diccionario de vuestra pareja." },
      { text: "Tour fotográfico por casa", sub: "Cada uno tiene 5 minutos para fotografiar 5 objetos que representen quién es ahora mismo. Se comentan." },
      { text: "El reto de los 30 segundos", sub: "Convencedme en 30 segundos de hacer algo que nunca haría. El otro actúa como el más escéptico posible." },
      { text: "Playlist de nuestra vida", sub: "Cread juntos una playlist de 10 canciones que cuenten vuestra historia, una por año desde 2015." },
      { text: "El mapa de nuestra relación", sub: "En un papel, dibujad juntos un 'mapa' de vuestra historia: hitos, lugares, momentos clave. Sin reglas." },
      { text: "Adivina el olor", sub: "Con los ojos cerrados, el otro acerca diferentes objetos o alimentos. ¿Cuántos acertáis?" },
      { text: "El reto del elogio en cadena", sub: "Uno empieza con un cumplido. El otro lo supera. Y así durante 2 minutos sin repetir. ¿Hasta dónde llegáis?" },
      { text: "Verdad o reto — versión adultos", sub: "Clásico pero a vuestra medida. Las preguntas y los retos los ponéis vosotros. Nada está prohibido." },
      { text: "El juego del 'me gustaría que...'", sub: "Por turnos: 'Me gustaría que esta semana...'. El otro escucha sin interrumpir y decide si puede hacerlo." },
      { text: "Adivina la canción tarareada", sub: "Sin palabras, solo tararear. El otro tiene 30 segundos. Turno por turno. Puntuad." },
      { text: "El periódico de nuestra pareja", sub: "Inventad los titulares del periódico de vuestra semana. Redacción libre, humor permitido." },
      { text: "Reto de escritura colaborativa", sub: "En 15 minutos, escribid juntos el primer párrafo de un cuento que empiece por 'Aquella noche en Zaragoza...'" },
      { text: "El juego del detective", sub: "Uno elige un recuerdo compartido y da pistas. El otro adivina de qué momento se trata." },
      { text: "Origami para dos", sub: "Buscad un tutorial de origami simple en YouTube. Hacedlo juntos. El que lo acabe primero elige el postre." },
      { text: "Test de compatibilidad casero", sub: "Cada uno responde por separado: color favorito, animal, estación, película. Comparad y buscad las coincidencias." },
      { text: "El reto del silencio total", sub: "30 minutos sin hablar, juntos. Podéis comunicaros por gestos, notas, o miradas. ¿Qué pasa?" },
      { text: "Inventad un cóctel juntos", sub: "Con lo que tengáis en casa. Le ponéis un nombre. Lo probáis. Lo puntuáis del 1 al 10." },
      { text: "El álbum de recortes digital", sub: "Cada uno busca 5 imágenes que representen cómo ve al otro ahora mismo. Se explican." },
      { text: "Karaoke de dueto", sub: "Elegid una canción para cantarla a dúo. Ensayad 5 minutos. Actuación obligatoria." },
      { text: "El reto del cumplido físico", sub: "Cada uno debe decir 5 cosas que le gustan físicamente del otro — con detalles, sin atajos." },
      { text: "Juego de palabras encadenadas temático", sub: "Solo palabras relacionadas con vuestra historia. El primero que no encuentra una pierde." },
      { text: "El menú de nuestra boda imaginaria", sub: "Si os casarais hoy, ¿cuál sería el menú? ¿La música? ¿El lugar? Diseñadlo juntos en 20 minutos." },
      { text: "Reto: un día sin quejarse", sub: "Todo el día. Si uno se queja, el otro lo apunta. Al final del día, el que menos puntos tiene elige el plan del fin de semana." },
    ]
  },
  {
    id: 2, label: "🏙️ Salidas y Aventuras", short: "Salida",
    items: [
      { text: "Zaragoza como turistas", sub: "Visitad un barrio como si fuera la primera vez. El Gancho, el mercado central, las Delicias... Haced fotos como extranjeros." },
      { text: "Restaurante sacado a suertes", sub: "Abrid Google Maps, cerrad los ojos, poned el dedo. Vais a ese restaurante esta noche." },
      { text: "Autobús sin destino", sub: "Coged el primer bus que pase. Bajad cuando os apetezca. Caminad. Volved andando si podéis." },
      { text: "Fin de semana en San Sebastián", sub: "2 días, pintxos, mar, casco viejo. A menos de 3h en coche desde Zaragoza. A planificar este mes." },
      { text: "Ruta del vino del Somontano", sub: "Un día, dos bodegas como máximo, picnic entre medias. Bodegas Enate o Viñas del Vero para empezar." },
      { text: "Senderismo en los Pirineos + picnic", sub: "Una mochila, embutido, una botella de vino. Una subida fácil o media según las ganas. Valle de Hecho u Ordesa." },
      { text: "Escape room en Zaragoza", sub: "Perfecto para la complicidad y las carcajadas garantizadas. Buscad un tema que os atraiga." },
      { text: "Curso de cocina juntos", sub: "Buscad un taller en Zaragoza. Cocina aragonesa, japonesa, italiana... Da igual — lo que importa es el 'hacerlo juntos'." },
      { text: "Cine de verano al aire libre", sub: "Estad atentos a la programación estival en Zaragoza. Llevad una manta y snacks caseros." },
      { text: "Visita a un museo + cena temática", sub: "Museo Pablo Gargallo, Museo de Zaragoza o el Museo del Foro. Elegid un restaurante relacionado con la temática de la expo." },
      { text: "Un día en Barcelona", sub: "Tren Renfe directo. Llegada por la mañana, vuelta por la noche. Barrio Gótico, Boqueria, paseo marítimo. Un solo objetivo: callejear." },
      { text: "Taller de cerámica", sub: "Buscad un curso de alfarería en Zaragoza. Crear algo juntos con las manos — una experiencia rara y memorable." },
      { text: "Noche de flamenco", sub: "Si nunca lo habéis hecho juntos: un tablao de verdad, no el espectáculo turístico. Buscad recomendaciones locales." },
      { text: "Paseo nocturno por Zaragoza", sub: "Después de las 22h, la ciudad cambia. Tomaos algo a orillas del Ebro. Id donde nunca vais normalmente." },
      { text: "Picnic en el Parque Grande José Antonio Labordeta", sub: "Un domingo por la mañana. Cruasanes, café en termo, periódico. Sin móvil durante 1 hora." },
      { text: "Fin de semana en Bilbao", sub: "El Guggenheim, el puerto viejo, los pintxos. 3h en coche. Reservad un hotelito en el centro." },
      { text: "Road trip de un día sin GPS", sub: "Dirección vagamente 'norte' o 'sur'. Parad en cuanto algo os llame la atención. De vuelta antes de medianoche." },
      { text: "Observación astronómica nocturna", sub: "Salid de la ciudad una noche de luna nueva. Buscad un punto sin contaminación lumínica. Llevad una manta." },
      { text: "Clases de baile", sub: "Salsa, tango, bachata — da igual. Una iniciación en Zaragoza. Podéis ser malísimos: ese es el objetivo." },
      { text: "Mercado de productores + cocina improvisada", sub: "Id juntos al mercado por la mañana. Comprad lo que os llame. Volved a casa y cocinar sin receta." },
      { text: "Día de spa o termas", sub: "Buscad un spa day en Zaragoza o en un hotel de los alrededores. Desconexión total." },
      { text: "Ir a ver un espectáculo en vivo", sub: "Concierto, teatro, comedia, ópera — el estilo da igual. Lo esencial: algo que no habrías elegido solo/a." },
      { text: "Visita a un pueblo de Aragón que no conozcáis", sub: "Sos, Alquézar, Daroca, Rubielos de Mora... Elegid uno al azar en el mapa. Id sin reservar nada." },
      { text: "Tarde de museos en Zaragoza de punta a punta", sub: "Empezad en el Museo del Foro romano, acabad en el Museo Pablo Gargallo. A pie entre medias." },
      { text: "Senderismo nocturno", sub: "Una ruta corta y segura al atardecer. Linternas, manta, algo de beber. El cielo de Aragón de noche es otro mundo." },
      { text: "Un día en el Monasterio de Piedra", sub: "Cascadas, jardines, silencio. A 1h30 de Zaragoza. Perfecto para un domingo tranquilo." },
      { text: "Mercado de las Pulgas de Zaragoza", sub: "Id sin presupuesto fijo. Cada uno elige un objeto para el otro por menos de 5€. Explicad vuestra elección." },
      { text: "Cena en un sitio totalmente nuevo para los dos", sub: "Sin googlear reseñas. Entrad por la pinta y el instinto. Sorpresa garantizada." },
      { text: "Fin de semana en la Costa Brava", sub: "Cadaqués, Begur o Calella de Palafrugell. Calas, anchoas, y paseos por callejuelas. A reservar." },
      { text: "Un día de senderismo en el Moncayo", sub: "El techo de Aragón. Subida media, vistas espectaculares. Llevad bocadillos y un buen termo." },
      { text: "Visita a las Bardenas Reales", sub: "El desierto de Navarra, a 1h de Zaragoza. Un paisaje lunar que parece de otro planeta." },
      { text: "Tarde de cine de autor", sub: "Buscad una película en versión original en Zaragoza. Después, cena y debate sobre la película." },
      { text: "Concierto de jazz o música clásica", sub: "Buscad la programación del Auditorio de Zaragoza. Elegid algo que ninguno de los dos habría escogido solo." },
      { text: "Un día en Pamplona", sub: "La ciudad vieja, el Camino de Santiago, los pintxos. A 1h30. Ir y volver en el día." },
      { text: "Visita a una bodega con cata", sub: "Somontano, Campo de Borja o Cariñena — todas a menos de 1h. Reservad una cata guiada." },
      { text: "Tarde de bicicleta por el Ebro", sub: "El carril bici a orillas del Ebro en Zaragoza. Alquilad bicis si no tenéis. Parad donde queráis." },
      { text: "Un domingo en el Mercado Central", sub: "Llegad temprano, comprad sin lista. Desayunad en la barra de algún bar del mercado." },
      { text: "Fin de semana en Cuenca", sub: "Las casas colgadas, el casco histórico, el silencio. A 3h de Zaragoza. Una joya infravisitada." },
      { text: "Noche en un hotel rural de Aragón", sub: "No hace falta ir lejos. Una masía o un hotel con encanto a 1h. Cena, desayuno, paseo matinal." },
      { text: "Visita al Palacio de la Aljafería de noche", sub: "Si hay visitas nocturnas, es una experiencia diferente. Comprobad la programación." },
      { text: "Un día de esquí en Formigal o Candanchú", sub: "Si os apetece en temporada. O simplemente subir a ver la nieve sin esquiar." },
      { text: "Tarde de compras en el Casco Antiguo", sub: "Sin lista, sin prisa. Cada uno elige una tienda para el otro. Presupuesto: lo que queráis." },
      { text: "Visita al Parque Natural de la Sierra de Guara", sub: "Barrancos, pueblos medievales, buitres. Una de las joyas naturales de Aragón." },
      { text: "Un concierto al aire libre en verano", sub: "Zaragoza tiene una programación estival rica. Elegid algo juntos con un mes de antelación." },
      { text: "Día en Logroño y La Rioja", sub: "La Calle Laurel, vinos, tapas. A 1h30. Un clásico que nunca decepciona." },
      { text: "Paseo en barca por el Ebro", sub: "Si hay servicio disponible en Zaragoza. O simplemente sentaos a orillas del río a ver pasar el agua." },
      { text: "Un día completo sin móviles", sub: "Salid a donde queráis — pero los teléfonos se quedan en casa. Veréis la diferencia." },
    ]
  },
  {
    id: 3, label: "✨ Rituales cotidianos", short: "Ritual",
    items: [
      { text: "El mensaje inesperado", sub: "Un WhatsApp en pleno día, sin motivo. Sin ocasión especial. Solo porque sí." },
      { text: "El mejor momento del día", sub: "Cada noche en la cena: cada uno dice su mejor momento del día. Regla: el 'meh' está prohibido." },
      { text: "La sorpresa mensual", sub: "Cada uno organiza algo por turnos. Sin límite de presupuesto. El otro no sabe qué, ni cuándo. Este mes: ¿a quién le toca?" },
      { text: "Nuestra canción del mes", sub: "Elegimos una canción que represente esta época. La escuchamos juntos. La añadimos a una playlist 'Nosotros'." },
      { text: "El abrazo de 20 segundos", sub: "Parece una tontería. No lo es. La oxitocina necesita al menos 20 segundos para activarse. Cada día." },
      { text: "Café del domingo por la mañana", sub: "Nada más. Sin móvil, sin lista de la compra. Solo el café y vosotros dos." },
      { text: "El cumplido del lunes", sub: "Cada lunes, al salir al trabajo: un cumplido de verdad. No 'estás guapa' — algo concreto y específico." },
      { text: "La nota escondida", sub: "Deslizad un post-it en el bolso, el bolsillo, la mochila — donde el otro lo encuentre por sorpresa." },
      { text: "La cena sin pantallas", sub: "Una vez a la semana. Móviles boca abajo. Sin tele. Solo vosotros dos y conversación." },
      { text: "El balance del mes", sub: "El último domingo del mes: 10 minutos. Lo que nos ha gustado, lo que menos, lo que queremos vivir el mes que viene." },
      { text: "El paseo de la tarde", sub: "20 minutos después de cenar, a pie, juntos. Sin destino fijo. Regla: nada de temas 'logísticos'." },
      { text: "La película de la semana", sub: "Alternáis: una semana eliges tú, la siguiente ella. No se puede criticar la elección del otro." },
      { text: "El objeto-recuerdo", sub: "Traed algo de cada salida — una entrada, una foto, una piedra. Guardadlo en una caja común." },
      { text: "La nota de agradecimiento", sub: "Una vez al mes, escribid al otro (en papel) algo que haya hecho y que no hayáis agradecido lo suficiente." },
      { text: "La playlist 'Nosotros'", sub: "Cread una playlist de Spotify compartida. Cada uno añade una canción a la semana. Escuchadla juntos el fin de semana." },
      { text: "El ritual de antes de dormir", sub: "Antes de apagar: una cosa buena del día, un gesto de ternura. Sin móvil durante al menos 15 minutos." },
      { text: "La foto del fin de semana", sub: "Cada fin de semana, una sola foto que os guste a los dos. Una al mes para imprimir." },
      { text: "El despertador amable", sub: "Una vez a la semana, el que se despierta primero prepara el café y lo deja listo para el otro." },
      { text: "La pregunta del día", sub: "Cada mañana, uno hace al otro una pregunta inesperada. No tiene que ser profunda — puede ser absurda." },
      { text: "El gesto del martes", sub: "Elegid un día de la semana para un pequeño gesto especial. No tiene que costar nada. Solo tiene que ser intencionado." },
      { text: "La palabra del día", sub: "Cada uno elige una palabra en español, francés o inglés que describa cómo se siente ese día. Sin explicaciones obligatorias." },
      { text: "El abrazo de bienvenida", sub: "Cuando uno llega a casa, parar todo — móvil incluido — y darse un abrazo de verdad. Sin prisa." },
      { text: "El cuaderno de nosotros", sub: "Un cuaderno físico donde apuntáis citas, momentos, ideas, tonterías. Sin reglas. Sin estructura." },
      { text: "La cena de los miércoles", sub: "Un día fijo a la semana: cena especial, aunque sea una tortilla. El secreto es la intención, no el menú." },
      { text: "El rincón de los recuerdos", sub: "Un espacio en casa — un estante, una pared — donde ponéis objetos, fotos o recuerdos de vuestros momentos." },
      { text: "El 'te pienso' del mediodía", sub: "A la hora de comer, un mensaje corto. No 'qué hay para cenar' — algo real. Un recuerdo, una imagen, una frase." },
      { text: "El ritual del domingo", sub: "Un domingo al mes, sin plan fijo. Os despertáis y decidís en el momento. Sin agenda, sin obligaciones." },
      { text: "La canción del despertar", sub: "Elegid juntos una canción para poner los sábados por la mañana mientras desayunáis. Cambiadla cada mes." },
      { text: "El mapa de los sueños", sub: "Tened un mapa del mundo en casa. Clavad un pin en cada lugar que queráis visitar juntos. Id añadiendo." },
      { text: "El libro compartido", sub: "Cada uno recomienda un libro al otro por trimestre. Lo leéis a vuestro ritmo y lo comentáis cuando acabéis." },
      { text: "La foto del día especial", sub: "En cada aniversario, cumpleaños o fecha importante: la misma foto, en el mismo lugar. Año tras año." },
      { text: "El ritual de la luna llena", sub: "Una vez al mes, salid a verla juntos aunque sea 10 minutos. Con una copa o sin ella." },
      { text: "El 'gracias de hoy'", sub: "Antes de dormir: un gracias específico. No genérico — algo que el otro haya hecho ese día." },
      { text: "La caminata del sábado", sub: "30 minutos a pie, juntos, sin destino. Sin móvil. Solo caminar y hablar — o no hablar." },
      { text: "El menú sorpresa mensual", sub: "Una vez al mes, uno cocina algo que el otro no espera. Sin pistas. El otro pone la mesa sin saber qué vendrá." },
      { text: "El ritual del viernes", sub: "El viernes por la noche: nada de trabajo, nada de pendientes. Una botella abierta y vosotros dos." },
      { text: "El álbum del año", sub: "En diciembre, imprimid las mejores fotos del año y guardadlas en un álbum físico. Una tradición que dura." },
      { text: "El desafío de los 21 días", sub: "Elegid juntos un hábito nuevo: caminar, meditar, leer. 21 días juntos. Os apoyáis mutuamente." },
      { text: "La cita en casa", sub: "Una vez al mes, una cita en casa como si fuera la primera. Ropa arreglada, velas, menú pensado. Sin excusas." },
      { text: "El rincón de lectura compartida", sub: "Un sillón, una manta, dos libros diferentes. En silencio pero juntos. Una hora sin pantallas." },
      { text: "El 'mañana hacemos...'", sub: "Cada domingo noche, cada uno propone una cosa para hacer juntos esa semana. Pequeña o grande." },
      { text: "El ritual del cumpleaños propio", sub: "El día del cumpleaños de cada uno, el otro organiza el día entero. Sin que el cumpleañero tome ninguna decisión." },
    ]
  },
  {
    id: 4, label: "💑 Complicidad y Ternura", short: "Ternura",
    items: [
      { text: "Masajes mutuos", sub: "20 minutos cada uno. Música suave, sin móvil. Es tanto dar como recibir." },
      { text: "Noche de 'primera cita'", sub: "Comportaos como si os conocierais por primera vez. Arreglaos. Id a un sitio donde nunca vais." },
      { text: "Bailar en el salón", sub: "Sin motivo. Poned vuestra canción favorita y bailad como si nadie os mirara — porque nadie os mira." },
      { text: "Leer juntos", sub: "Elegid un libro para leer en voz alta, un capítulo cada uno. Una novela, un relato, da igual." },
      { text: "Ver fotos antiguas juntos", sub: "Sin objetivo. Simplemente abrir el álbum (o el móvil) y dejar que los recuerdos vuelvan." },
      { text: "Cocinar juntos un plato ambicioso", sub: "Un plato que nunca hayáis hecho. Sin presión sobre el resultado. Lo esencial es el proceso." },
      { text: "Noche sin despertador", sub: "Apagad las alarmas. Dormid hasta que os despertéis solos. Desayuno en la cama si es posible." },
      { text: "Carta para leer dentro de 5 años", sub: "Cada uno escribe una carta al otro. Se sellan. Se guardan. Prometéis leerlas juntos dentro de 5 años." },
      { text: "Volver a un lugar lleno de recuerdos", sub: "El lugar de una primera cita, un viaje, un momento importante. Id juntos. Hablar de lo que sentís." },
      { text: "Noche de pijamas sin plan", sub: "Quedaos en casa, pedid comida a domicilio, poneos el pijama, ved lo que queráis. Cero presión, cero programa." },
      { text: "El baño o la ducha juntos", sub: "Con velas si queréis. El agua caliente relaja, desata, acerca." },
      { text: "Desayuno en la cama un domingo", sub: "Lo preparáis por turnos. El otro se queda bajo el edredón hasta que todo esté listo." },
      { text: "Deciros 3 cosas que admiráis el uno del otro — ahora", sub: "No dentro de 10 años. Ahora. En voz alta. Miraderos a los ojos." },
      { text: "Noche de películas antiguas", sub: "Películas de antes de conoceros. Las que fueron importantes para cada uno. El otro descubre una parte de quién erais." },
      { text: "Hacerse una foto juntos como en los viejos tiempos", sub: "Buscad la primera foto que tengáis juntos. Reproducidla exactamente hoy. Mismo gesto, mismo plano." },
      { text: "Escuchar música juntos en silencio", sub: "Un álbum entero, tumbados, sin hacer nada más. Dejar que la música llene el espacio." },
      { text: "Contarse el sueño de anoche", sub: "Con todos los detalles, aunque sea absurdo. El otro escucha sin interrumpir y lo interpreta libremente." },
      { text: "Una tarde de mantas y nada", sub: "Sin plan, sin película elegida de antemano, sin teléfono. Solo estar. Ver qué surge." },
      { text: "Escribiros una postal", sub: "Aunque estéis en la misma ciudad. Una postal de papel, con sello, enviada por correo. El placer de recibirla días después." },
      { text: "Preparar juntos el desayuno ideal", sub: "No el de todos los días — el desayuno de vuestra vida. Croissants, zumo, fruta, lo que sea. Con calma." },
      { text: "Mirarse a los ojos durante 2 minutos", sub: "Sin hablar. Sin reír (intentadlo). Es incómodo los primeros 30 segundos. Después, algo cambia." },
      { text: "Contarse el mejor día de vuestra vida", sub: "No necesariamente juntos. El mejor día que cada uno recuerda. Con detalle. El otro escucha." },
      { text: "Una siesta juntos un domingo", sub: "Sin alarma. Sin culpa. Solo el placer de dormirse con el otro cerca." },
      { text: "Elegir juntos una obra de arte para casa", sub: "Puede ser una lámina, una foto impresa, algo del mercadillo. Algo que os represente a los dos." },
      { text: "Hacerse una entrevista fotográfica", sub: "Uno hace de fotógrafo, el otro de modelo. 15 minutos cada uno. Sin filtros, sin poses forzadas." },
      { text: "Contarse un miedo que nunca se ha dicho", sub: "No el miedo a las arañas. Uno de verdad. El otro escucha sin minimizar." },
      { text: "Ver el amanecer juntos", sub: "Poneos el despertador antes de que salga el sol un fin de semana. Un café, una manta, y el cielo cambiando de color." },
      { text: "Escribir juntos vuestra lista de 'nunca nos aburriremos si...'", sub: "Cosas que siempre os sacan una sonrisa. Tenerla a mano para los días grises." },
      { text: "Compartir un auricular", sub: "La misma canción, un auricular cada uno. Pasead o quedaos quietos. Dejad que la música os conecte." },

// State
let currentCat = null;
let currentCard = null;
let usedIndices = {};
let favorites = JSON.parse(localStorage.getItem('couple_favs_es') || '[]');

// Floating hearts
function createHearts() {
  const container = document.getElementById('heartsbg');
  const symbols = ['♥', '♡', '❤', '♥', '♡'];
  for (let i = 0; i < 12; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = symbols[i % symbols.length];
    h.style.left = (5 + Math.random() * 90) + '%';
    h.style.fontSize = (0.7 + Math.random() * 0.9) + 'rem';
    h.style.color = Math.random() > 0.5 ? '#c4714a' : '#d4908a';
    h.style.animationDuration = (18 + Math.random() * 22) + 's';
    h.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(h);
  }
}
createHearts();

// Init category buttons
const catContainer = document.getElementById('categories');
CATEGORIES.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = `cat-btn cat-${i}`;
  btn.textContent = cat.label;
  btn.onclick = () => selectCategory(i);
  catContainer.appendChild(btn);
});

function selectCategory(id) {
  currentCat = id;
  if (!usedIndices[id]) usedIndices[id] = [];
  document.querySelectorAll('.cat-btn').forEach((b, i) => {
    b.classList.toggle('active', i === id);
  });
  updateProgressBar();
  draw();
}

function resetCurrent() {
  if (currentCat === null) return;
  usedIndices[currentCat] = [];
  updateProgressBar();
  updateStats();
  // Visual feedback on button
  const btn = document.getElementById('btnReset');
  btn.textContent = '✓ Listo';
  setTimeout(() => { btn.textContent = '↺ Reiniciar'; }, 1400);
  // Redraw card area to empty state
  document.getElementById('cardArea').innerHTML = `
    <div class="empty">
      <span class="empty-icon">♡</span>
      <p class="empty-text">Categoría reiniciada</p>
      <p class="empty-sub">¡Saca una nueva carta!</p>
    </div>`;
  document.getElementById('btnFav').style.display = 'none';
}

function randomCategory() {
  const id = Math.floor(Math.random() * CATEGORIES.length);
  selectCategory(id);
}

function updateProgressBar() {
  if (currentCat === null) return;
  const cat = CATEGORIES[currentCat];
  const total = cat.items.length;
  const seen = (usedIndices[currentCat] || []);
  const bar = document.getElementById('progressBar');
  const label = document.getElementById('progressLabel');
  const dots = document.getElementById('progressDots');

  bar.style.display = 'flex';
  label.textContent = `${seen.length} de ${total} cartas vistas`;

  // Build dots — use hearts every 5th dot
  dots.innerHTML = cat.items.map((_, i) => {
    const isSeen = seen.includes(i);
    if ((i + 1) % 5 === 0) {
      return `<span class="dot heart" title="${i+1}">${isSeen ? '♥' : '♡'}</span>`;
    }
    return `<span class="dot ${isSeen ? 'seen' : ''}" title="${i+1}"></span>`;
  }).join('');
}

function draw() {
  if (currentCat === null) {
    randomCategory();
    return;
  }
  const cat = CATEGORIES[currentCat];
  let pool = cat.items.map((_, i) => i).filter(i => !(usedIndices[currentCat] || []).includes(i));

  if (pool.length === 0) {
    usedIndices[currentCat] = [];
    pool = cat.items.map((_, i) => i);
  }

  const idx = pool[Math.floor(Math.random() * pool.length)];
  if (!usedIndices[currentCat]) usedIndices[currentCat] = [];
  usedIndices[currentCat].push(idx);
  currentCard = { catId: currentCat, itemIdx: idx };

  const item = cat.items[idx];
  const total = cat.items.length;
  const used = usedIndices[currentCat].length;

  const area = document.getElementById('cardArea');
  area.innerHTML = `
    <div class="card color-${currentCat}">
      <div class="card-tag">${cat.short}</div>
      <p class="card-text">${item.text}</p>
      ${item.sub ? `<p class="card-sub">${item.sub}</p>` : ''}
      <div class="card-counter">${used}/${total}</div>
    </div>
  `;

  document.getElementById('btnFav').style.display = 'inline-block';
  updateProgressBar();
  updateStats();
}

function saveFav() {
  if (!currentCard) return;
  const cat = CATEGORIES[currentCard.catId];
  const item = cat.items[currentCard.itemIdx];
  const fav = { catLabel: cat.short, text: item.text, catId: currentCard.catId };

  if (!favorites.some(f => f.text === fav.text)) {
    favorites.push(fav);
    localStorage.setItem('couple_favs_es', JSON.stringify(favorites));
    renderFavs();

    const btn = document.getElementById('btnFav');
    btn.textContent = '♥ ¡Guardada!';
    btn.style.borderColor = 'var(--terracotta)';
    btn.style.color = 'var(--terracotta)';
    setTimeout(() => {
      btn.textContent = '♡ Guardar';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 1600);
  }
}

function removeFav(idx) {
  favorites.splice(idx, 1);
  localStorage.setItem('couple_favs_es', JSON.stringify(favorites));
  renderFavs();
}

function renderFavs() {
  const section = document.getElementById('favsSection');
  const list = document.getElementById('favsList');
  if (favorites.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = favorites.map((f, i) => `
    <div class="fav-item">
      <div>
        <div class="fav-cat">${f.catLabel}</div>
        <div>${f.text}</div>
      </div>
      <button class="fav-remove" onclick="removeFav(${i})">✕</button>
    </div>
  `).join('');
}

function updateStats() {
  const total = CATEGORIES.reduce((s, c) => s + c.items.length, 0);
  const used = Object.values(usedIndices).reduce((s, arr) => s + arr.length, 0);
  document.getElementById('stats').textContent = `${used} carta${used !== 1 ? 's' : ''} vista${used !== 1 ? 's' : ''} de ${total} en total`;
}

renderFavs();
updateStats();

// Register service worker for PWA
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

</script>
</body>
</html>
